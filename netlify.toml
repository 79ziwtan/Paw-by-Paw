# Netlify reads this on every deploy.
# One site serves both: the landing page at / and the trainer app everywhere else.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `npm run build` writes the landing page to dist/index.html (served at /) and the app to
# dist/app.html. Every other path (/app, /login, /dogs/..., owner links /u/<token> and
# /o/<token>) falls through to the app. Real files like /index.html and /assets/* win first.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
