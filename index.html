<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffcf5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Waffle</title>
    <style>
      /* Boot screen, shown until React replaces #root. Mirrors <WaffleLoader> (src/components/ui.tsx). */
      body { margin: 0; background: #fffcf5 }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 500 14px 'DM Sans', system-ui, sans-serif; color: #8a7f70 }
      @keyframes waffle-bite-1 { 0%, 17.9% { opacity: 0 } 18%, 85.9% { opacity: 1 } 86%, 100% { opacity: 0 } }
      @keyframes waffle-bite-2 { 0%, 35.9% { opacity: 0 } 36%, 85.9% { opacity: 1 } 86%, 100% { opacity: 0 } }
      @keyframes waffle-bite-3 { 0%, 53.9% { opacity: 0 } 54%, 85.9% { opacity: 1 } 86%, 100% { opacity: 0 } }
      @keyframes waffle-bite-4 { 0%, 71.9% { opacity: 0 } 72%, 85.9% { opacity: 1 } 86%, 100% { opacity: 0 } }
      @keyframes waffle-regrow { 0%, 85.9% { transform: scale(1) } 86% { transform: scale(0.55) } 100% { transform: scale(1) } }
      .boot .bite-1 { animation: waffle-bite-1 2.2s infinite }
      .boot .bite-2 { animation: waffle-bite-2 2.2s infinite }
      .boot .bite-3 { animation: waffle-bite-3 2.2s infinite }
      .boot .bite-4 { animation: waffle-bite-4 2.2s infinite }
      .boot .waffle-body { transform-origin: 32px 32px; animation: waffle-regrow 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite }
      @media (prefers-reduced-motion: reduce) { .boot .bite-1, .boot .bite-2, .boot .bite-3, .boot .bite-4, .boot .waffle-body { animation: none } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <clipPath id="boot-clip"><circle cx="32" cy="32" r="22" /></clipPath>
            <mask id="boot-mask">
              <rect width="64" height="64" fill="white" />
              <g class="bite-1"><circle cx="44" cy="20" r="16" /><circle cx="37.3" cy="4.5" r="10" /><circle cx="59.5" cy="26.7" r="10" /></g>
              <g class="bite-2"><circle cx="44" cy="44" r="16" /><circle cx="59.5" cy="37.3" r="10" /><circle cx="37.3" cy="59.5" r="10" /></g>
              <g class="bite-3"><circle cx="20" cy="44" r="16" /><circle cx="26.7" cy="59.5" r="10" /><circle cx="4.5" cy="37.3" r="10" /></g>
              <g class="bite-4"><circle cx="20" cy="20" r="16" /><circle cx="4.5" cy="26.7" r="10" /><circle cx="26.7" cy="4.5" r="10" /></g>
            </mask>
          </defs>
          <g class="waffle-body" mask="url(#boot-mask)">
            <circle cx="32" cy="32" r="27" fill="#f0b12e" stroke="#b9760c" stroke-width="2.5" />
            <g clip-path="url(#boot-clip)" fill="#de9614">
              <rect x="8.5" y="8.5" width="7" height="7" rx="1.6" /><rect x="18.5" y="8.5" width="7" height="7" rx="1.6" /><rect x="28.5" y="8.5" width="7" height="7" rx="1.6" /><rect x="38.5" y="8.5" width="7" height="7" rx="1.6" /><rect x="48.5" y="8.5" width="7" height="7" rx="1.6" />
              <rect x="8.5" y="18.5" width="7" height="7" rx="1.6" /><rect x="18.5" y="18.5" width="7" height="7" rx="1.6" /><rect x="28.5" y="18.5" width="7" height="7" rx="1.6" /><rect x="38.5" y="18.5" width="7" height="7" rx="1.6" /><rect x="48.5" y="18.5" width="7" height="7" rx="1.6" />
              <rect x="8.5" y="28.5" width="7" height="7" rx="1.6" /><rect x="18.5" y="28.5" width="7" height="7" rx="1.6" /><rect x="28.5" y="28.5" width="7" height="7" rx="1.6" /><rect x="38.5" y="28.5" width="7" height="7" rx="1.6" /><rect x="48.5" y="28.5" width="7" height="7" rx="1.6" />
              <rect x="8.5" y="38.5" width="7" height="7" rx="1.6" /><rect x="18.5" y="38.5" width="7" height="7" rx="1.6" /><rect x="28.5" y="38.5" width="7" height="7" rx="1.6" /><rect x="38.5" y="38.5" width="7" height="7" rx="1.6" /><rect x="48.5" y="38.5" width="7" height="7" rx="1.6" />
              <rect x="8.5" y="48.5" width="7" height="7" rx="1.6" /><rect x="18.5" y="48.5" width="7" height="7" rx="1.6" /><rect x="28.5" y="48.5" width="7" height="7" rx="1.6" /><rect x="38.5" y="48.5" width="7" height="7" rx="1.6" /><rect x="48.5" y="48.5" width="7" height="7" rx="1.6" />
            </g>
          </g>
        </svg>
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
